<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Intensity Sensor</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            display: flex;
            align-items: center;
           
        }

        .container {
            position: relative;
            width: 100vw;
            height: 90vh;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .background {
            width: 103%;
            height: 45%;
        
        }

        .back-arrow {
            position: absolute;
            top: -6px;
            left: 50px;
            font-size: 80px;
            cursor: pointer;
            color: #faf5f5;
        }

        .status {
            font-size: 30px;
            margin-top: 20px;
            font-weight: 60px;
        }

        .connected {
            color: #28a745;
            font-weight: bold;
        }

        .sensor-data {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
        }

        .lux-circle {
            width: 300px;
            height: 300px;
            border: 4px solid green;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: bold;
            background: #eaffd0;
            margin-top: -30px;
            margin-left: -800px;
            margin-bottom: 50px;
        }

        .time-display {
            font-size: 80px;
            font-weight: bold;
            color: #444;
            margin-left: 15px;
            margin-top: 10px;
            position: relative;
        }

        .time-display::after {
            content: "";
            display: block;
            width: 360px;
            height: 4px;
            background-color: green;
            position: absolute;
            left: -64px;
            bottom: -10px;
        }

        .reading-section {
            margin-top: -370px;
            margin-left: 580px;
            font-size: 30px;
        }

        .chart {
            width: 500px;
            height: 1500px;
            margin-top: 30px;
            margin-left: 800px;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .info-box {
            background: #FDE79E;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 30px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            margin-top: -30px;
            margin-right: 1000px;
            border: 1px solid black;
        }

        .checkmark {
            color: #28a745;
            font-weight: bold;
            font-size: 18px;
        }

        h2 {
            margin-top: 115px;
            font-size: 28px;
            font-weight: 700;
            color: #15662A;
        }

        @media (max-width: 1200px) {
            .lux-circle {
                margin-left: 0;
            }

            .reading-section {
                margin-left: 0;
                margin-top: 20px;
            }

            .chart {
                margin-left: 0;
                width: 100%;
                height: auto;
            }

            .info-box {
                margin-right: 0;
                margin-top: 20px;
            }

            .background {
                width: 100%;
                height: auto;
            }
        }

        @media (max-width: 768px) {
            .time-display {
                font-size: 40px;
            }

            .lux-circle {
                width: 200px;
                height: 200px;
                font-size: 30px;
            }

            .chart {
                width: 100%;
                height: 400px;
            }

            .info-box {
                font-size: 20px;
            }

            .back-arrow {
                font-size: 40px;
            }

            .background {
                width: 100%;
                height: auto;
            }
        }

        @media (max-width: 480px) {
            .time-display {
                font-size: 40px;
            }

            .lux-circle {
                width: 300px;
                height: 300px;
                font-size: 48px;
                margin-left: 120px;
                margin-top: -11px;
            }

            .chart {
                height: 300px;
            }

            .info-box {
                font-size: 35px;
                margin-left: 130px;
                margin-top: -20px;
                width: 450px;
            }

            .back-arrow {
                font-size: 70px;
                color: #d9cfcf;
            }

            .background {
                width: 172%;
                height: 100%;

            }
            .time-display::after {
               content: "";
                display: block;
                width: 160px;
                height: 4px;
                background-color: green;
                position: absolute;
                left: -45px;
                bottom: -10px;
          }
          .status {
               font-size: 32px;
               margin-top: 20px;
               margin-left: 100px;
           }
           .reading-section {
            margin-top: 60px;
            margin-left: 100px;
            font-size: 30px;
        }
        .chart {
            width: 530px;
            height: 1500px;
            margin-top: 30px;
            margin-left: 130px;
        }
 
           
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="landscape_background.jpg" class="background" alt="Landscape Background">
        <div class="back-arrow">&#x2190;</div>

        <p class="status">Status: <span class="connected">CONNECTED</span></p>
        <div class="sensor-data">
            <div class="lux-circle">
                <p><strong>100 lux</strong><br>Average per Hour</p>
            </div>
            <div class="time-display">00:00</div>
        </div>
        <div class="info-box">
            <span class="checkmark">✔</span> Has normal readings.
        </div>
        <div class="reading-section">
            <label for="date">Readings on:</label>
            <input type="date" id="date">
        </div>
        <div class="chart">
            <canvas id="luxChart"></canvas>
        </div>
        <h2>LIGHT INTENSITY SENSOR</h2>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        var ctx = document.getElementById('luxChart').getContext('2d');
        var luxChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['0', '1', '2', '3', '4', '5'],
                datasets: [{
                    label: 'Light Intensity',
                    data: [50, 200, 150, 400, 250, 300],
                    borderColor: 'blue',
                    borderWidth: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    </script>
</body>
</html>
